<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TriageFlow Lite — sign in</title>
  <script src="https://cdn.tailwindcss.com/3.4.13"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v={{ asset_v }}" />
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] },
      colors: { ink: '#0a0a0a', subtle: '#6b7280', line: '#ededed' } } } };
  </script>
</head>
<body class="bg-white text-ink font-sans antialiased">
  <main class="login2">
    <!-- brand -->
    <div class="login2-brand">
      <div class="login2-logo">T</div>
      <div>
        <div class="text-[17px] font-bold leading-none">TriageFlow <span class="text-subtle font-normal">Lite</span></div>
        <div class="text-[12px] text-subtle mt-1">Priority triage, sourced to the SATS chart.</div>
      </div>
    </div>

    <!-- SATS legend: colour-coded bands with score range + target -->
    <div class="sats2">
      <div class="sats2-head">
        <span>SATS priority</span><span>TEWS score</span><span>See within</span>
      </div>
      {% for code, acuity, score, time in bands %}
      <div class="sats2-row band-{{ code }}">
        <span class="s-band">{{ code }}<em>{{ acuity }}</em></span>
        <span class="s-score">{{ score }}</span>
        <span class="s-time">{{ time }}</span>
      </div>
      {% endfor %}
    </div>

    <!-- compact demo sign-in -->
    <div class="login2-signin">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[12px] font-semibold text-subtle uppercase tracking-wide">Sign in</span>
        <span class="demo-badge"><span class="d"></span>Demo</span>
      </div>
      <div class="flex gap-2">
        <select id="staff" class="flex-1">
          <option value="">Choose a staff member…</option>
          {% for s in roster %}
          <option value="{{ s.id }}">{{ s.name }} · {{ s.role }}</option>
          {% endfor %}
        </select>
        <button id="btn-login" class="btn bg-ink text-white whitespace-nowrap" disabled>Start →</button>
      </div>
      <div id="login-err" class="hidden note-red mt-2"></div>
    </div>
    <p class="text-[11px] text-subtle text-center mt-4">Demo · synthetic data only · staff are fictional</p>
  </main>

  <script>
    const ROSTER = {{ roster | tojson }};
    const sel = document.getElementById("staff");
    const btn = document.getElementById("btn-login");
    const err = document.getElementById("login-err");
    sel.addEventListener("change", () => { btn.disabled = !sel.value; });
    btn.addEventListener("click", async () => {
      if (!sel.value) return;
      btn.disabled = true; err.classList.add("hidden");
      try {
        const r = await fetch("/api/session/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ staff_id: sel.value }),
        });
        if (!r.ok) { const d = await r.json(); throw new Error(d.error || "Sign-in failed"); }
        window.location.href = "/";
      } catch (e) {
        err.textContent = String(e.message || e); err.classList.remove("hidden"); btn.disabled = false;
      }
    });
  </script>
</body>
</html>
