name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The desk PC may be Windows or Linux — tested on both. (macOS runners are scarce and
        # slow to schedule, so they're off; re-add macos-latest here if you need that coverage.)
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (incl. dev)
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests evals

      - name: Unit + flow tests (SATS table, approval gate, llama.cpp provisioning)
        run: uv run python -m pytest -q

      - name: Evaluation suite (scoring, flow, synthetic set, sign-finding)
        run: uv run python evals/run.py

  # Real proof that the model runtime works on each OS, with nothing mocked: the app's own
  # code downloads the official llama.cpp binary, starts llama-server with a 1 MB test model,
  # generates a few tokens and shuts it down.
  runtime:
    name: llama.cpp runtime · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are scarce/slow to schedule — off for now (re-add macos-latest if needed).
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv python install 3.12
      - run: uv sync
      - name: Provision llama-server, start it, generate, stop
        run: uv run python evals/runtime_smoke.py

  # Did this push touch anything that goes INTO the container image? The deploy job runs only
  # when it did, so a docs- or test-only change to main skips the ~5 GB build and the redeploy
  # entirely. (Runs only on main pushes; on PRs it's skipped, which skips deploy too.)
  changes:
    name: Image-relevant changes?
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'src/**'
              - 'protocols/**'
              - '.github/workflows/ci.yml'

  # Build the demo image and deploy to Amazon ECS Express Mode — only on main, only after every
  # test and runtime job above has passed, and only once the deployer has opted in by setting the
  # repository variable DEPLOY_TO_AWS=true (so this stays off, and free, until AWS is wired up).
  #
  # Why Express Mode, not App Runner: AWS closed App Runner to new customer accounts on
  # 2026-04-30, and now points new/migrating users to Amazon ECS Express Mode. Express Mode takes
  # our ECR image and provisions the Fargate service, Application Load Balancer, public HTTPS URL
  # and autoscaling for us — the App Runner experience, on a service that still accepts new
  # accounts. One-time AWS setup + the secrets/variables this needs are in docs/DEPLOY_AWS.md.
  deploy:
    name: Build & deploy to Amazon ECS Express Mode
    needs: [test, runtime, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_TO_AWS == 'true' && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to post the result as a commit comment
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          # A dedicated `:buildcache` tag with mode=max caches EVERY stage — including the
          # `assets` stage that downloads the ~5 GB model + llama.cpp binary. So when a build does
          # run, only changed app layers rebuild and the model is reused, never re-downloaded.
          # (inline cache couldn't cache that intermediate stage; this can.) image-manifest +
          # oci-mediatypes make the registry cache compatible with Amazon ECR.
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      # First-party AWS action: creates the Express Mode service the first time, then updates it
      # in place (rolling, zero-downtime) on every later run. It creates the `default` cluster if
      # missing and provisions/attaches the ALB, HTTPS endpoint and autoscaling. We deploy the
      # image tagged with this commit's SHA (not :latest) so each run is traceable and the new
      # tasks always pull the image we just built. Outputs: `endpoint` (public URL), `service-arn`.
      - name: Deploy to Amazon ECS Express Mode
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ vars.ECR_REPOSITORY }}
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          execution-role-arn: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
          container-port: "8000"
          health-check-path: /api/status
          cpu: "4096"              # 4 vCPU (CPU units)
          memory: "12288"          # 12 GB in MiB — the 7B model needs it
          min-task-count: "1"      # single instance: cheapest, plenty for a demo
          max-task-count: "1"

      - name: Comment the result on the commit
        if: always()
        uses: actions/github-script@v7
        env:
          ENDPOINT: ${{ steps.deploy.outputs.endpoint }}
          SERVICE_ARN: ${{ steps.deploy.outputs.service-arn }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const { ENDPOINT, SERVICE_ARN, DEPLOY_OUTCOME } = process.env;
            const sha = context.sha.slice(0, 7);
            let body;
            if (DEPLOY_OUTCOME === 'success' && ENDPOINT) {
              body = `### ✅ ECS Express Mode deploy — \`${sha}\`\n\n`
                   + `**Live demo:** ${ENDPOINT}\n\n`
                   + `_Priority scoring, the approval gate and the audit trail work immediately; `
                   + `the 7B model finishes loading a minute or two after the task starts._`;
            } else if (DEPLOY_OUTCOME === 'failure') {
              body = `### ❌ ECS Express Mode deploy failed for \`${sha}\`\n\n`
                   + `The image was pushed to ECR, but creating/updating the Express service did `
                   + `not succeed — see the run logs.`;
            } else {
              body = `### ⚠️ Deploy step did not report a result for \`${sha}\`\n\nSee the run logs.`;
            }
            core.summary.addRaw(body).write();
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner, repo: context.repo.repo,
                commit_sha: context.sha, body,
              });
            } catch (e) {
              core.warning(`could not post commit comment: ${e.message}`);
            }
