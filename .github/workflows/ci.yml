name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The desk PC may be Windows, macOS or Linux — every push is tested on all three.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (incl. dev)
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests evals

      - name: Unit + flow tests (SATS table, approval gate, llama.cpp provisioning)
        run: uv run python -m pytest -q

      - name: Evaluation suite (scoring, flow, synthetic set, sign-finding)
        run: uv run python evals/run.py

  # Real proof that the model runtime works on each OS, with nothing mocked: the app's own
  # code downloads the official llama.cpp binary, starts llama-server with a 1 MB test model,
  # generates a few tokens and shuts it down.
  runtime:
    name: llama.cpp runtime · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv python install 3.12
      - run: uv sync
      - name: Provision llama-server, start it, generate, stop
        run: uv run python evals/runtime_smoke.py

  # Build the demo image and deploy to AWS App Runner — only on main, only after every test
  # and runtime job above has passed, and only once the deployer has opted in by setting the
  # repository variable DEPLOY_TO_AWS=true (so this stays off, and free, until AWS is wired up).
  # One-time AWS setup + the secrets/variables this needs are in docs/DEPLOY_AWS.md.
  deploy:
    name: Build & deploy to AWS App Runner
    needs: [test, runtime]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_TO_AWS == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to post the result as a commit comment
    env:
      SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Does the App Runner service exist yet?
        id: svc
        env:
          REGION: ${{ vars.AWS_REGION }}
          NAME: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -uo pipefail
          ARN="$SERVICE_ARN"                          # explicit secret wins, if set
          if [ -z "$ARN" ]; then                      # else look it up by name (needs
            ARN=$(aws apprunner list-services --region "$REGION" \
                  --query "ServiceSummaryList[?ServiceName=='$NAME'].ServiceArn | [0]" \
                  --output text 2>/dev/null || true)  # apprunner:ListServices; tolerated if denied
          fi
          [ "$ARN" = "None" ] && ARN=""
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          [ -n "$ARN" ] && echo "service exists: $ARN" || echo "service does not exist yet"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          # Reuse unchanged layers (the ~5 GB model layer) from the last pushed image, so only
          # app changes rebuild. Keeps CI off the GitHub Actions cache size limit.
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-to: type=inline

      - name: Create the service (if missing) or deploy, then wait for it
        id: deploy
        env:
          REGION: ${{ vars.AWS_REGION }}
          NAME: ${{ vars.ECR_REPOSITORY }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ARN: ${{ steps.svc.outputs.arn }}
        run: |
          set -uo pipefail
          if [ -z "$ARN" ]; then
            echo "no service yet — creating it"
            ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
            ROLE_ARN="arn:aws:iam::${ACCOUNT}:role/AppRunnerECRAccessRole"
            SRC="{\"ImageRepository\":{\"ImageIdentifier\":\"${REGISTRY}/${NAME}:latest\",\"ImageRepositoryType\":\"ECR\",\"ImageConfiguration\":{\"Port\":\"8000\"}},\"AutoDeploymentsEnabled\":false,\"AuthenticationConfiguration\":{\"AccessRoleArn\":\"${ROLE_ARN}\"}}"
            ARN=$(aws apprunner create-service --service-name "$NAME" --region "$REGION" \
                  --source-configuration "$SRC" \
                  --instance-configuration '{"Cpu":"4 vCPU","Memory":"12 GB"}' \
                  --health-check-configuration '{"Protocol":"HTTP","Path":"/api/status","Interval":20,"Timeout":5,"HealthyThreshold":1,"UnhealthyThreshold":5}' \
                  --query 'Service.ServiceArn' --output text) || exit 1
            OP="create"
          else
            echo "service exists — deploying the new image"
            OP=$(aws apprunner start-deployment --service-arn "$ARN" --query OperationId --output text) || exit 1
          fi
          URL=$(aws apprunner describe-service --service-arn "$ARN" --query 'Service.ServiceUrl' --output text)
          sleep 20
          STATUS=UNKNOWN
          for i in $(seq 1 60); do                   # first creation pulls ~5 GB + loads the model
            STATUS=$(aws apprunner describe-service --service-arn "$ARN" --query 'Service.Status' --output text)
            echo "[$i] status=$STATUS"
            case "$STATUS" in
              RUNNING) break ;;
              *FAILED*|PAUSED|DELETE*) break ;;
            esac
            sleep 15
          done
          {
            echo "deployed=true"
            echo "status=$STATUS"
            echo "url=https://$URL"
            echo "operation=$OP"
          } >> "$GITHUB_OUTPUT"

      - name: Comment the result on the commit
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOYED: ${{ steps.deploy.outputs.deployed }}
          STATUS: ${{ steps.deploy.outputs.status }}
          URL: ${{ steps.deploy.outputs.url }}
          OPERATION: ${{ steps.deploy.outputs.operation }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const { DEPLOYED, STATUS, URL, OPERATION, DEPLOY_OUTCOME } = process.env;
            const sha = context.sha.slice(0, 7);
            let body;
            if (DEPLOYED === 'true') {
              const ok = STATUS === 'RUNNING';
              body = `### ${ok ? '✅' : '⏳'} App Runner deploy — \`${STATUS}\`\n\n`
                   + `**Live demo:** ${URL}\n\nImage \`${sha}\` · deployment \`${OPERATION}\``
                   + (ok ? '' : `\n\n_Still rolling out — give it a minute, then refresh._`);
            } else if (DEPLOY_OUTCOME === 'failure') {
              body = `### ❌ App Runner deploy failed\n\nImage \`${sha}\` was pushed, but `
                   + `\`start-deployment\` or the rollout did not succeed — see the run logs.`;
            } else {
              body = `### ⚠️ Deploy step did not report a result for \`${sha}\`\n\nSee the run logs.`;
            }
            core.summary.addRaw(body).write();
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner, repo: context.repo.repo,
                commit_sha: context.sha, body,
              });
            } catch (e) {
              core.warning(`could not post commit comment: ${e.message}`);
            }
