[project]
name = "triageflow-lite"
version = "0.1.0"
description = "Agentic SATS triage prioritisation for busy OPD triage desks — sourced, nurse-confirmed, never a diagnosis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "TriageFlow Lite contributors" }]
keywords = ["triage", "SATS", "MCP", "agent", "healthcare", "FHIR"]

dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
triageflow = "triageflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triageflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: long lines are confined to docstrings and clinical data tables, not logic.
# UP042: `str, Enum` is deliberate — it serialises cleanly with Pydantic/JSON across versions.
# BLE/S broad-except and try/except-pass are intentional: the agent degrades gracefully
# (falls back to deterministic behaviour) rather than crashing a triage run.
ignore = ["E501", "UP042", "E741", "B008"]
